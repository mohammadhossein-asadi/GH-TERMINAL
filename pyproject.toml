[project]
name = "gh-terminal"
version = "3.1.0"
description = "GH-TERMINAL v3.1 Neon Edition — Ultimate GitHub Configuration & Management System"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "mohammadhossein-asadi"}
]
keywords = ["github", "cli", "git", "terminal", "devops", "neon", "tui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: System :: Shells",
    "Topic :: Utilities",
]
dependencies = [
    "rich>=13.7.0",
    "textual>=0.52.0",
    "pyyaml>=6.0.1",
    "click>=8.1.7",
    "python-dotenv>=1.0.0",
    "platformdirs>=4.0.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "pre-commit>=3.5.0",
    "pyinstaller>=6.1.0",
]

[project.scripts]
gh-terminal = "gh_terminal.__main__:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["gh_terminal*"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "N", "UP", "W", "C90", "PTH", "SIM", "T20", "PL", "TRY", "RUF", "PD", "PGH", "PT"]
ignore = ["S101", "S311", "PLC0415", "PLR0913", "PLR0917", "TRY003"]
per-file-ignores = { "tests/*" = ["S101"], "src/gh_terminal/core/cli.py" = ["C901", "PLR0915"], "src/gh_terminal/modules/identity.py" = ["PLR0913", "PLR0917", "PLC0415"], "src/gh_terminal/modules/ssh_keys.py" = ["PLR0913", "PLR0917", "PLR0911", "C901", "PLC0415"], "src/gh_terminal/modules/accounts.py" = ["PLR0913", "PLR0917", "PLR0911", "PLC0415"], "src/gh_terminal/modules/repo.py" = ["PLR0913", "PLR0917", "PLR0911", "PLR0912", "C901", "PLR2004", "PLC0415", "UP045"], "src/gh_terminal/modules/advanced.py" = ["PLR0913", "PLR0917", "PLR0911", "C901", "PLC0415"], "src/gh_terminal/modules/interactive.py" = ["C901", "PLR0912", "PLR2004", "PLC0415"], "src/gh_terminal/modules/auth.py" = ["PLR2004"], "src/gh_terminal/utils/system.py" = ["PLR0911", "SIM112", "PTH119", "PTH111", "PTH123"] }

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
ignore_missing_imports = false
files = ["src/gh_terminal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --strict-config"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
    "requires_gh: Tests requiring gh CLI",
    "requires_git: Tests requiring git",
]

[tool.coverage.run]
source = ["src/gh_terminal"]
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]